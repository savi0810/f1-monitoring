services:
  postgres-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    build:
      context: .
      dockerfile: src/Auth.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres-auth;Port=5432;Database=authdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
    depends_on:
      postgres-auth:
        condition: service_healthy

  postgres-telemetry:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetrydb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_telemetry_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d telemetrydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry-api:
    build:
      context: .
      dockerfile: src/Telemetry.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres-telemetry;Port=5432;Database=telemetrydb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: F1Monitor.Auth
      Jwt__Audience: F1Monitor
    depends_on:
      postgres-telemetry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres-alerts:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alertsdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_alerts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d alertsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  alerts-api:
    build:
      context: .
      dockerfile: src/Alerts.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres-alerts;Port=5432;Database=alertsdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: F1Monitor.Auth
      Jwt__Audience: F1Monitor
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres-alerts:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  live-api:
    build:
      context: .
      dockerfile: src/Live.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: redis:6379
      Redis__Password: ${REDIS_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: F1Monitor.Auth
      Jwt__Audience: F1Monitor
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 120s

  f1-collector:
    build:
      context: .
      dockerfile: src/F1.Collector/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway-api:
    build:
      context: .
      dockerfile: src/Gateway.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5055:8080"
    depends_on:
      - auth-api
      - telemetry-api
      - alerts-api
      - live-api

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      gateway-api:
        condition: service_started

volumes:
  postgres_auth_data:
  postgres_telemetry_data:
  postgres_alerts_data:
