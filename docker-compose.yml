services:
  postgres-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    build:
      context: .
      dockerfile: src/Auth.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres-auth;Port=5432;Database=authdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5185:8080"
    depends_on:
      postgres-auth:
        condition: service_healthy

  telemetry-api:
    build:
      context: .
      dockerfile: src/Telemetry.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5168:8080"

  alerts-api:
    build:
      context: .
      dockerfile: src/Alerts.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5262:8080"

  live-api:
    build:
      context: .
      dockerfile: src/Live.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5052:8080"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  f1-collector:
    build:
      context: .
      dockerfile: src/F1.Collector/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5301:8080"

  gateway-api:
    build:
      context: .
      dockerfile: src/Gateway.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5055:8080"
    depends_on:
      - auth-api
      - telemetry-api
      - alerts-api
      - live-api

volumes:
  postgres_auth_data:
